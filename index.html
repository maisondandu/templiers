<title>Les Templiers</title>

<style>

  --text:#1B2420;

  --accent-ink:#FFFFFF;
  --accent-soft:#DCEAE7;
  --gold:#9C6B1F;
  --gold-soft:#F3E6CC;
  --success:#2F7A4F;
  --success-soft:#E1F2E7;

:root[data-theme="dark"]{
  --bg:#141917;
  --bg-tex:#1A211D;

  --surface-2:#232B27;
  --border:#2E3733;

  --text-muted:#9DAAA3;

  --gold:#D9A857;

<style>
* { box-sizing: border-box; }
html { color-scheme: light; }
body{
  margin:0;
  background:var(--bg);
  background-image:
    radial-gradient(circle at 1px 1px, var(--bg-tex) 1px, transparent 0);
  background-size: 22px 22px;
  color:var(--text);
  font-family:'Karla', ui-sans-serif, system-ui, sans-serif;
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{ font-family:'Fraunces', Georgia, serif; text-wrap:balance; margin:0; }
.mono{ font-family:'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric:tabular-nums; }
a{ color:var(--accent); }
button{ font-family:inherit; }
:focus-visible{ outline:2px solid var(--focus); outline-offset:2px; border-radius:4px; }

.page{ max-width:920px; margin:0 auto; padding:20px 16px 64px; }

.topbar{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:10px 4px 22px; flex-wrap:wrap;
}
.brand{ display:flex; align-items:center; gap:10px; }
.brand-mark{ font-size:26px; line-height:1; }
.brand-name{ font-family:'Fraunces', serif; font-weight:600; font-size:22px; letter-spacing:-0.01em; }
.whoami{ display:flex; align-items:center; gap:6px; font-size:14px; color:var(--text-muted); }
.whoami strong{ color:var(--text); }
.topbar.solo{ justify-content:center; }

.hero{
  background:linear-gradient(160deg, var(--accent) 0%, #33665F 100%);
  color:var(--accent-ink);
  border-radius:20px;
  padding:26px 26px 22px;
  box-shadow:0 12px 28px -14px var(--shadow);
  margin-bottom:18px;
  position:relative;
  overflow:hidden;
}
.hero::after{
  content:"";
  position:absolute; right:-40px; top:-40px; width:180px; height:180px;
  background:radial-gradient(circle, rgba(255,255,255,0.14), transparent 70%);
}
.hero-eyebrow{
  font-size:12px; text-transform:uppercase; letter-spacing:0.09em; font-weight:600;
  opacity:0.85; margin-bottom:6px;
}
.hero-week{ font-size:15px; opacity:0.92; margin-bottom:2px; }
.hero-person{
  font-family:'Fraunces', serif; font-weight:700; font-size:clamp(28px, 6vw, 40px);
  margin:2px 0 12px; letter-spacing:-0.01em;
}
.pill{
  display:inline-flex; align-items:center; gap:6px;
  font-size:12.5px; font-weight:600; padding:4px 11px; border-radius:999px;
  background:rgba(255,255,255,0.16); color:#fff;
}
.pill[data-status="pending"]{ background:rgba(255,255,255,0.18); }
.pill-solo{
  font-size:12.5px; font-weight:600; padding:4px 11px; border-radius:999px;
}
.pill-solo[data-status="pending"]{ background:var(--warning-soft); color:var(--warning); }
.pill-solo[data-status="pending_validation"]{ background:var(--gold-soft); color:var(--gold); }
.pill-solo[data-status="done"]{ background:var(--success-soft); color:var(--success); }
.pill-solo[data-status="swapped"]{ background:var(--info-soft); color:var(--info); }
.admin-btn{ margin-left:6px; }

.hero-actions{ display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; }
.hero-detail{ font-size:14.5px; opacity:0.95; margin-top:10px; }

.btn{
  border:none; border-radius:10px; padding:10px 16px; font-size:14.5px; font-weight:600;
  cursor:pointer; display:inline-flex; align-items:center; gap:7px; transition:transform .08s ease, filter .12s ease;
}
.btn:active{ transform:translateY(1px); }
.btn-primary{ background:#fff; color:var(--accent); }
.btn-primary:hover{ filter:brightness(0.96); }
.btn-ghost{ background:rgba(255,255,255,0.14); color:#fff; }
.btn-ghost:hover{ background:rgba(255,255,255,0.22); }
.btn-solid{ background:var(--accent); color:var(--accent-ink); }
.btn-solid:hover{ filter:brightness(1.06); }
.btn-outline{ background:transparent; color:var(--accent); border:1.5px solid var(--accent); }
.btn-outline:hover{ background:var(--accent-soft); }
.btn-danger-outline{ background:transparent; color:var(--danger); border:1.5px solid var(--danger); }
.btn-small{ padding:6px 12px; font-size:13px; border-radius:8px; }
.btn:disabled{ opacity:0.5; cursor:not-allowed; }
.link-btn{
  background:none; border:none; color:var(--text-muted); font-size:13.5px; cursor:pointer;
  padding:4px 6px; border-radius:6px;
}
.link-btn:hover{ color:var(--text); background:var(--surface-2); }

.swap-panel{
  margin-top:16px; background:rgba(255,255,255,0.12); border-radius:14px; padding:16px;
}
.swap-panel label{ font-size:13.5px; font-weight:600; display:block; margin-bottom:6px; }
.swap-panel select{
  width:100%; padding:9px 10px; border-radius:8px; border:none; font-size:14.5px;
  margin-bottom:12px; font-family:inherit;
}
.radio-row{ display:flex; flex-direction:column; gap:8px; margin-bottom:14px; }
.radio-opt{
  display:flex; align-items:flex-start; gap:9px; background:rgba(255,255,255,0.10);
  padding:10px 12px; border-radius:10px; cursor:pointer; font-size:14px;
}
.radio-opt input{ margin-top:3px; }
.swap-actions{ display:flex; gap:10px; }

.grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-bottom:18px; }
@media (max-width:720px){ .grid-2{ grid-template-columns:1fr; } }

.card{
  background:var(--surface); border:1px solid var(--border); border-radius:16px;
  padding:20px 20px 18px; box-shadow:0 6px 18px -14px var(--shadow);
}
.card + .card{ margin-top:18px; }
.card-head{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:14px; }
.card-title{ font-size:19px; font-weight:600; }
.card-sub{ font-size:12.5px; color:var(--text-muted); }

.plan-table{ width:100%; border-collapse:collapse; font-size:14.5px; }
.plan-table th{
  text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:0.06em;
  color:var(--text-muted); font-weight:600; padding:0 8px 8px 0; border-bottom:1px solid var(--border);
}
.plan-table td{ padding:9px 8px 9px 0; border-bottom:1px solid var(--border); vertical-align:middle; }
.plan-table tr:last-child td{ border-bottom:none; }
.plan-table tr[data-current="true"] td{ background:var(--accent-soft); }
.plan-table tr[data-current="true"] td:first-child{ border-radius:8px 0 0 8px; }
.plan-table tr[data-current="true"] td:last-child{ border-radius:0 8px 8px 0; }

.debt-row{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:11px 0; border-bottom:1px solid var(--border);
}
.debt-row:last-child{ border-bottom:none; }
.debt-text{ font-size:14.5px; }
.debt-date{ font-size:12px; color:var(--text-muted); display:block; margin-top:2px; }

.empty{
  color:var(--text-muted); font-size:14px; padding:14px 0; text-align:center;
  border:1.5px dashed var(--border); border-radius:12px; margin-top:2px;
}

form.form{ margin-top:4px; }
.field{ margin-bottom:12px; }
.field label{ display:block; font-size:13px; font-weight:600; margin-bottom:5px; color:var(--text); }
.field input[type="text"], .field input[type="number"], .field select{
  width:100%; padding:9px 11px; border-radius:9px; border:1px solid var(--border);
  background:var(--surface); color:var(--text); font-size:14.5px; font-family:inherit;
}
.two-col{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.checks{ display:flex; flex-wrap:wrap; gap:8px; }
.check{
  display:flex; align-items:center; gap:6px; font-size:13.5px;
  border:1px solid var(--border); border-radius:999px; padding:6px 12px; cursor:pointer;
}
.check input{ accent-color:var(--accent); }

.expense-row{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; padding:11px 0; border-bottom:1px solid var(--border); }
.expense-row:last-child{ border-bottom:none; }
.expense-desc{ font-size:14.5px; font-weight:600; }
.expense-meta{ font-size:12.5px; color:var(--text-muted); margin-top:2px; }
.expense-amount{ font-weight:600; white-space:nowrap; }
.expense-del{ background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:15px; padding:2px 6px; border-radius:6px; }
.expense-del:hover{ color:var(--danger); background:var(--danger-soft); }

.balance-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:11px 0; border-bottom:1px solid var(--border); }
.balance-row:last-child{ border-bottom:none; }
.balance-text{ font-size:14.5px; }
.balance-amount{ font-weight:700; color:var(--gold); }

.solde-grid{ display:flex; flex-direction:column; }
.solde-row{ display:flex; align-items:center; justify-content:space-between; padding:7px 0; font-size:14.5px; }
.solde-name{ font-weight:600; }
.solde-amount{ font-weight:700; }
.balance-positive{ color:var(--success); }
.balance-negative{ color:var(--gold); }
.balance-zero{ color:var(--text-muted); }
.balances-divider{ height:1px; background:var(--border); margin:6px 0 14px; }

.split-mode-row{ display:flex; gap:16px; flex-wrap:wrap; margin-bottom:2px; }
.radio-inline{ display:flex; align-items:center; gap:6px; font-size:13.5px; cursor:pointer; }
.split-person-row{ display:flex; align-items:center; gap:10px; margin-bottom:7px; }
.split-person-row .check{ flex:1; }
.split-value{
  width:96px; padding:7px 9px; border-radius:8px; border:1px solid var(--border);
  background:var(--surface); color:var(--text); font-size:13.5px; font-family:inherit;
}
#split-hint{ margin:2px 0 10px; min-height:16px; }
.expense-icon-btn{
  background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:14px;
  padding:4px 6px; border-radius:6px;
}
.expense-icon-btn:hover{ background:var(--surface-2); color:var(--text); }

.settings-panel{ margin-top:18px; }
.settings-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:14px; }
@media (max-width:520px){ .settings-grid{ grid-template-columns:1fr; } }

details.rules{ margin-top:18px; }
details.rules summary{
  cursor:pointer; font-weight:600; font-size:14.5px; color:var(--accent); list-style:none;
  display:flex; align-items:center; gap:6px;
}
details.rules summary::-webkit-details-marker{ display:none; }
details.rules[open] summary::after{ content:"▲"; font-size:10px; }
details.rules summary::after{ content:"▼"; font-size:10px; }
.rules-body{ font-size:14px; color:var(--text-muted); margin-top:10px; line-height:1.6; }
.rules-body ul{ margin:6px 0 0; padding-left:18px; }

.foot{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  margin-top:22px; padding:0 4px;
}
.sync-pill{
  font-size:12px; color:var(--text-muted); display:inline-flex; align-items:center; gap:6px;
}
.sync-dot{ width:7px; height:7px; border-radius:50%; background:var(--text-muted); }
.sync-pill[data-state="saved"] .sync-dot{ background:var(--success); }
.sync-pill[data-state="saving"] .sync-dot{ background:var(--warning); }
.sync-pill[data-state="error"] .sync-dot{ background:var(--danger); }
.sync-pill[data-state="readonly"] .sync-dot{ background:var(--info); }
.sync-pill[data-state="preview"] .sync-dot{ background:var(--text-muted); }

.banner{
  background:var(--info-soft); color:var(--info); border-radius:12px; padding:12px 14px;
  font-size:13.5px; margin-bottom:18px; display:flex; gap:8px; align-items:flex-start;
}
.hint-banner{
  background:var(--warning-soft); color:var(--warning); border-radius:12px; padding:12px 14px;
  font-size:13.5px; margin-bottom:18px;
}

.join-gate{
  background:linear-gradient(160deg, var(--accent) 0%, #33665F 100%);
  color:#fff; border-radius:20px; padding:32px 26px 28px; text-align:center;
  box-shadow:0 12px 28px -14px var(--shadow); position:relative; overflow:hidden;
  max-width:440px; margin:36px auto 0;
}
.join-gate::after{
  content:""; position:absolute; right:-40px; top:-40px; width:180px; height:180px;
  background:radial-gradient(circle, rgba(255,255,255,0.14), transparent 70%);
}
.join-mark{ font-size:36px; margin-bottom:8px; }
.join-title{ font-family:'Fraunces', serif; font-weight:700; font-size:clamp(24px, 6vw, 30px); margin-bottom:6px; }
.join-sub{ font-size:14px; opacity:0.92; margin:0 0 14px; }
.join-count{
  font-size:12.5px; opacity:0.95; background:rgba(255,255,255,0.14); display:inline-block;
  padding:5px 13px; border-radius:999px; margin-bottom:18px;
}
.join-form{ background:rgba(255,255,255,0.12); border-radius:14px; padding:18px; text-align:left; position:relative; }
.join-form .field label{ color:#fff; }
.join-form input[type="text"]{ background:rgba(255,255,255,0.94); border:none; }
.join-form .btn{ width:100%; justify-content:center; margin-top:2px; }
.join-existing{ margin-top:14px; background:rgba(255,255,255,0.10); border-radius:14px; padding:14px 16px; text-align:left; position:relative; }
.join-existing label{ font-size:13px; font-weight:600; display:block; margin-bottom:8px; }
.join-existing-row{ display:flex; gap:8px; }
.join-existing-row select{
  flex:1; padding:8px 10px; border-radius:8px; border:none; font-family:inherit; font-size:14px;
}
.join-full{ background:rgba(255,255,255,0.12); border-radius:14px; padding:16px; font-size:13.5px; text-align:left; }

.request-row{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:11px 0; border-bottom:1px solid var(--border);
}
.request-row:last-child{ border-bottom:none; }
.request-actions{ display:flex; gap:8px; flex-shrink:0; }
.pending-card{
  background:linear-gradient(160deg, var(--accent) 0%, #33665F 100%);
  color:#fff; border-radius:20px; padding:32px 26px 28px; text-align:center;
  box-shadow:0 12px 28px -14px var(--shadow); max-width:440px; margin:36px auto 0;
}
.pending-mark{ font-size:36px; margin-bottom:8px; }
.pending-title{ font-family:'Fraunces', serif; font-weight:700; font-size:clamp(22px, 6vw, 28px); margin-bottom:8px; }
.pending-sub{ font-size:14.5px; opacity:0.94; line-height:1.55; margin:0 0 18px; }
.pending-card .btn{ background:rgba(255,255,255,0.14); color:#fff; }
.pending-card .btn:hover{ background:rgba(255,255,255,0.22); }

.toast{
  position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
  background:var(--text); color:var(--bg); font-size:13.5px; padding:11px 18px;
  border-radius:999px; box-shadow:0 10px 24px -8px rgba(0,0,0,0.35); z-index:50;
  max-width:90vw; text-align:center;
}
.toast[hidden]{ display:none; }

@media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
</style>

<script>
(function(){
  "use strict";

  var MAX_PEOPLE = 4;

  var DEFAULT_STATE = {
    v: 1,
    house: "Les Templiers",
    people: [],
    joinRequests: [],
    admin: "Judicaël",
    anchor: "2026-09-19",
    weeks: {},
    choreDebts: [],
    ledger: []
  };

  var state = DEFAULT_STATE;
  var ui = { settingsOpen: false, swapOpenFor: null, editingExpenseId: null };
  var API_URL = "https://script.google.com/macros/s/AKfycbwzJmaZrVTv0X9H-56JAUeW6IABc3O6O3MBwM2Kce2KuE21pOwSGLejcWk-jCBUDD3vdg/exec";
  var accessCode = null;
  var rev = 0;
  var loaded = !API_URL;
  var loadError = "";
  var syncState = "preview";
  try { accessCode = localStorage.getItem("roulement_code"); } catch (e) {}
  var moi = null;
  try { moi = localStorage.getItem("roulement_moi"); } catch (e) {}

  /* ---------- date helpers ---------- */
  function pad(n){ return String(n).padStart(2,"0"); }
  function toISODate(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
  function parseISODate(s){ var p=s.split("-").map(Number); return new Date(p[0],p[1]-1,p[2]); }
  function addDays(d,n){ var r=new Date(d); r.setDate(r.getDate()+n); return r; }
  function weekendSaturday(date){
    var dow = date.getDay();
    if (dow === 6) return new Date(date);
    if (dow === 0) return addDays(date,-1);
    return addDays(date, 6-dow);
  }
  function weekKeyFromDate(date){ return toISODate(weekendSaturday(date)); }
  function nextWeekKey(k){ return toISODate(addDays(parseISODate(k),7)); }
  function weekIndexOf(weekKey, anchor){
    var diffDays = Math.round((parseISODate(weekKey) - parseISODate(anchor)) / 86400000);
    return Math.round(diffDays/7);
  }
  function weekKeyFromIndex(idx, anchor){ return toISODate(addDays(parseISODate(anchor), idx*7)); }
  function assignedFor(weekKey, st){
    var idx = weekIndexOf(weekKey, st.anchor);
    var n = st.people.length;
    var i = ((idx % n) + n) % n;
    return st.people[i];
  }
  function isResolved(weekKey, st){
    var w = st.weeks[weekKey];
    return !!(w && (w.status === "done" || w.status === "swapped"));
  }
  function currentWeekKey(st){
    var todayKey = weekKeyFromDate(new Date());
    var k = weekKeyFromDate(parseISODate(st.anchor));
    var guard = 0;
    while (k < todayKey && guard < 500) {
      if (!isResolved(k, st)) return k;
      k = nextWeekKey(k);
      guard++;
    }
    return todayKey;
  }
  var DOW_FULL = new Intl.DateTimeFormat("fr-FR", { day:"numeric" });
  var DOW_FMT = new Intl.DateTimeFormat("fr-FR", { day:"numeric", month:"short", year:"numeric" });
  function formatWeekendRange(satDate){
    var sun = addDays(satDate,1);
    if (satDate.getMonth() === sun.getMonth()) {
      return DOW_FULL.format(satDate) + "–" + DOW_FMT.format(sun);
    }
    return DOW_FMT.format(satDate) + " – " + DOW_FMT.format(sun);
  }
  function formatDate(iso){ return DOW_FMT.format(parseISODate(iso)); }
  function fmtEUR(n){ return n.toLocaleString("fr-FR", { style:"currency", currency:"EUR" }); }
  function todayISO(){ return toISODate(new Date()); }
  function uid(){ return "id" + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
    });
  }

  /* ---------- balances ---------- */
  var EXPENSE_CATEGORIES = [
    { key:"courses", icon:"🛒", label:"Courses" },
    { key:"loyer", icon:"🏠", label:"Loyer / charges" },
    { key:"internet", icon:"📶", label:"Internet / abonnements" },
    { key:"energie", icon:"💡", label:"Électricité / énergie" },
    { key:"sorties", icon:"🍽️", label:"Sorties / restaurant" },
    { key:"menage", icon:"🧹", label:"Ménage / entretien" },
    { key:"autre", icon:"📦", label:"Autre" }
  ];
  function categoryOf(key){
    var found = null;
    EXPENSE_CATEGORIES.forEach(function(c){ if (c.key === key) found = c; });
    return found || EXPENSE_CATEGORIES[EXPENSE_CATEGORIES.length - 1];
  }
  function splitItems(e){
    if (!e.split || !e.split.length) return [];
    if (typeof e.split[0] === "string") {
      return splitEqual(e.amount, e.split);
    }
    return e.split;
  }
  function splitEqual(totalAmount, names){
    var cents = Math.round(totalAmount * 100);
    var n = names.length;
    if (n === 0) return [];
    var base = Math.floor(cents / n);
    var rem = cents - base * n;
    return names.map(function(name, i){
      var c = base + (i < rem ? 1 : 0);
      return { name: name, amount: Math.round(c) / 100 };
    });
  }
  function splitByWeights(totalAmount, entries){
    var cents = Math.round(totalAmount * 100);
    var totalWeight = entries.reduce(function(s, e){ return s + e.weight; }, 0);
    if (totalWeight <= 0) return entries.map(function(e){ return { name: e.name, amount: 0 }; });
    var raw = entries.map(function(e){
      var exact = cents * (e.weight / totalWeight);
      return { name: e.name, floor: Math.floor(exact), rem: exact - Math.floor(exact) };
    });
    var assigned = raw.reduce(function(s, r){ return s + r.floor; }, 0);
    var leftover = cents - assigned;
    raw.sort(function(a, b){ return b.rem - a.rem; });
    for (var i = 0; i < leftover && i < raw.length; i++) { raw[i].floor += 1; }
    var byName = {};
    raw.forEach(function(r){ byName[r.name] = r.floor; });
    return entries.map(function(e){ return { name: e.name, amount: Math.round(byName[e.name]) / 100 }; });
  }
  function findExpense(st, id){
    var found = null;
    st.ledger.forEach(function(e){ if (e.id === id && e.type === "expense") found = e; });
    return found;
  }

  function computeNet(st){
    var net = {};
    st.people.forEach(function(p){ net[p] = 0; });
    st.ledger.forEach(function(e){
      if (e.type === "expense") {
        net[e.paidBy] = (net[e.paidBy] || 0) + e.amount;
        splitItems(e).forEach(function(it){ net[it.name] = (net[it.name] || 0) - it.amount; });
      } else if (e.type === "swap_payment") {
        net[e.from] = (net[e.from] || 0) - e.amount;
        net[e.to] = (net[e.to] || 0) + e.amount;
      } else if (e.type === "settlement") {
        net[e.from] = (net[e.from] || 0) + e.amount;
        net[e.to] = (net[e.to] || 0) - e.amount;
      }
    });
    return net;
  }
  function simplifyDebts(net){
    var creditors = [], debtors = [];
    Object.keys(net).forEach(function(p){
      var v = net[p];
      if (v > 0.005) creditors.push({ p:p, v:v });
      else if (v < -0.005) debtors.push({ p:p, v:-v });
    });
    creditors.sort(function(a,b){ return b.v - a.v; });
    debtors.sort(function(a,b){ return b.v - a.v; });
    var tx = [], i = 0, j = 0;
    while (i < debtors.length && j < creditors.length) {
      var d = debtors[i], c = creditors[j];
      var amt = Math.min(d.v, c.v);
      tx.push({ from:d.p, to:c.p, amount: Math.round(amt*100)/100 });
      d.v -= amt; c.v -= amt;
      if (d.v <= 0.005) i++;
      if (c.v <= 0.005) j++;
    }
    return tx;
  }

      detail = '<div class="hero-detail">'+esc(entry.doneBy)+' affirme avoir fait le ménage le '+esc(formatDate(entry.date))+'. En attente de validation par un·e autre colocataire.</div>';

      var validatedLine = entry.validatedBy ? ' · validé par '+esc(entry.validatedBy) : '';
      detail = '<div class="hero-detail">Fait par '+esc(entry.doneBy)+" le "+esc(formatDate(entry.date))+validatedLine+".</div>";
    } else if (status === "swapped") {
      var arr = entry.swap.arrangement === "chore_debt"

      detail = '<div class="hero-detail">Fait par '+esc(entry.swap.to)+" à la place de "+esc(entry.swap.from)+". "+arr+".</div>";

    var actions = "";

          (st.people.length >= 2 ? '<button type="button" class="btn btn-ghost" data-action="open-swap" data-week="'+esc(wk)+'">⇄ Demander un échange</button>' : '') +
        '</div>';

        ? '<div class="hero-actions"><button type="button" class="btn btn-primary" data-action="validate-done" data-week="'+esc(wk)+'">✓ Valider</button></div>'

      } else {

      }

            '<label class="radio-opt"><input type="radio" name="arrangement" value="chore_debt" checked> '+esc(assigned)+" doit un ménage en retour (dette de ménage)</label>" +
            '<label class="radio-opt"><input type="radio" name="arrangement" value="payment"> 🪙 '+esc(assigned)+" verse 20 pièces (20 €)</label>" +
          '</div>' +
          '<div class="swap-actions">' +
            '<button type="submit" class="btn btn-primary btn-small">Confirmer l’échange</button>' +
            '<button type="button" class="btn btn-ghost btn-small" data-action="cancel-swap">Annuler</button>' +
          '</div>' +
        '</form>';
    }

    return (
      '<div class="hero">' +
        '<div class="hero-eyebrow">Tour de ménage</div>' +
        '<div class="hero-week">Semaine du '+range+'</div>' +
        '<div class="hero-person">'+esc(assigned)+'</div>' +

  function renderPlanning(st){

  function renderBalances(st){
    var net = computeNet(st);

    var ranked = st.people.slice().sort(function(a, b){ return (net[b] || 0) - (net[a] || 0); });
    var soldeRows = ranked.map(function(p){
      var v = Math.round((net[p] || 0) * 100) / 100;
      var cls = v > 0.005 ? "balance-positive" : v < -0.005 ? "balance-negative" : "balance-zero";
      var sign = v > 0.005 ? "+" : v < -0.005 ? "−" : "";
      return (
        '<div class="solde-row">' +
          '<span class="solde-name">'+esc(p)+'</span>' +
          '<span class="solde-amount mono '+cls+'">'+sign+fmtEUR(Math.abs(v))+'</span>' +
        '</div>'
      );
    }).join("");

    var tx = simplifyDebts(net);
    var rows;
    if (tx.length === 0) {
      rows = '<div class="empty">Tout le monde est à jour ✅</div>';
    } else {
      rows = tx.map(function(t){
        return (
          '<div class="balance-row">' +
            '<div class="balance-text"><strong>'+esc(t.from)+'</strong> doit <strong>'+esc(t.to)+'</strong></div>' +
            '<div style="display:flex;align-items:center;gap:10px;">' +

            '</div>' +
          '</div>'
        );

    }
    return (

        '<div class="card-head"><h3 class="card-title">Soldes</h3><span class="card-sub">Dépenses + échanges de ménage payés</span></div>' +

            '<button type="button" class="btn btn-outline btn-small" data-action="reject-request" data-id="'+esc(r.id)+'">Refuser</button>' +
            '<button type="button" class="btn btn-solid btn-small" data-action="approve-request" data-id="'+esc(r.id)+'"'+(full?' disabled title="Complet"':'')+'>Accepter</button>' +

      );
    }).join("");
    return (

        '<div class="card-head"><h3 class="card-title">Demandes d’adhésion</h3>'+(full?'<span class="card-sub">Complet</span>':'')+'</div>' +

    );
  }

  function renderBanner(){

    }

      return '<div class="banner">⚠️ Connexion perdue — tes dernières modifications ne sont peut-être pas enregistrées.</div>';

  function renderCodeGate(){

      '<div class="pending-card">' +
        '<div class="pending-mark">⏳</div>' +
        '<h1 class="pending-title">'+(loadError ? 'Connexion impossible' : 'Chargement…')+'</h1>' +

  function renderApp(st){

        renderJoinGate(st)
      );
    }

    var html =
      '<div class="topbar">' +
        '<div class="brand"><span class="brand-mark">🧹</span><span class="brand-name">'+esc(st.house)+'</span></div>' +
        '<div class="whoami">Bonjour, <strong>'+esc(moi)+'</strong> · <button type="button" class="link-btn" data-action="switch-me">changer</button></div>' +
      '</div>' +
      renderBanner() +
      renderJoinRequests(st) +
      renderHero(st) +
      '<div class="grid-2">' + renderPlanning(st) + renderChoreDebts(st) + '</div>' +
      renderExpenses(st) +
      renderBalances(st) +
      '<details class="rules"'+(ui.rulesOpen ? " open" : "")+'><summary>Comment ça marche ?</summary>' +
        '<div class="rules-body">' +
          '<p>Le ménage se fait un week-end sur '+st.people.length+', à tour de rôle entre les colocataires inscrit·e·s.</p>' +
          '<ul>' +
            '<li>À sa première visite, chaque colocataire demande à rejoindre '+esc(st.house)+' en tapant son prénom, et l’administrateur·rice ('+esc(st.admin)+') valide l’inscription.</li>' +
            '<li>Si tu peux le faire : clique sur <em>Marquer comme fait</em>, puis un·e autre colocataire doit <em>Valider</em> pour confirmer.</li>' +
            '<li>L’administrateur·rice (réglable dans les Réglages) peut valider n’importe quelle semaine directement, sans validation croisée.</li>' +
            '<li>Si tu ne peux pas : demande à un·e colocataire de le faire à ta place. S’il·elle accepte, choisissez un arrangement — soit tu lui dois un ménage plus tard, soit tu lui verses 20 pièces (20 €).</li>' +
            '<li>Les dépenses courantes (courses, factures…) se répartissent entre colocataires et s’ajoutent au même solde que les échanges payés.</li>' +
          '</ul>' +
        '</div>' +
      '</details>' +
      renderSettings(st) +
      '<div class="foot">' +
        '<span class="sync-pill" data-state="'+syncState+'" id="sync-status"><span class="sync-dot"></span>'+syncLabel(syncState)+'</span>' +
        '<button type="button" class="link-btn" data-action="toggle-settings">⚙️ Réglages</button>' +
      '</div>';
    return html;
  }

  function syncLabel(s){
    return { saved:"Enregistré", saving:"Enregistrement…", error:"Échec de l’enregistrement",
      readonly:"Lecture seule", preview:"Aperçu" }[s] || "";
  }

  function renderAll(){
    document.getElementById("app").innerHTML = renderApp(state);
    var ef = document.getElementById("expense-form");
    if (ef) updateSplitUI(ef);
  }

  /* ---------- expense split form (local DOM-only, no persist) ---------- */
  function updateSplitUI(form){
    var modeInput = form.querySelector('input[name="splitMode"]:checked');
    if (!modeInput) return;
    var mode = modeInput.value;
    var rows = form.querySelectorAll(".split-person-row");
    for (var i = 0; i < rows.length; i++) {
      var checkbox = rows[i].querySelector('input[name="split"]');
      var valueInput = rows[i].querySelector(".split-value");
      if (mode === "equal") {
        valueInput.hidden = true;
      } else {
        valueInput.hidden = !checkbox.checked;
        valueInput.placeholder = mode === "shares" ? "Parts (1)" : "0,00";
        if (checkbox.checked && !valueInput.value && mode === "shares") valueInput.value = "1";
      }
    }
    updateSplitHint(form, mode);
  }

  function updateSplitHint(form, mode){
    var hint = form.querySelector("#split-hint");
    if (!hint) return;
    var amountInput = form.querySelector("#exp-amount");
    var total = parseFloat(amountInput ? amountInput.value : "") || 0;
    if (mode === "exact") {
      var sum = 0;
      var rows = form.querySelectorAll(".split-person-row");
      for (var i = 0; i < rows.length; i++) {
        var checkbox = rows[i].querySelector('input[name="split"]');
        if (checkbox.checked) sum += parseFloat(rows[i].querySelector(".split-value").value) || 0;
      }
      var diff = Math.round((total - sum) * 100) / 100;
      hint.textContent = diff === 0 ? "Réparti à 100 % ✓" : diff > 0
        ? "Reste " + fmtEUR(diff) + " à répartir"
        : fmtEUR(-diff) + " de trop réparti·s";
    } else if (mode === "shares") {
      var totalShares = 0;
      var rows2 = form.querySelectorAll(".split-person-row");
      for (var j = 0; j < rows2.length; j++) {
        var cb2 = rows2[j].querySelector('input[name="split"]');
        if (cb2.checked) totalShares += parseFloat(rows2[j].querySelector(".split-value").value) || 0;
      }
      hint.textContent = totalShares > 0 ? totalShares + (totalShares > 1 ? " parts au total" : " part au total") : "Ajoute au moins une part";
    } else {
      hint.textContent = "";
    }
  }

  /* ---------- toast ---------- */
  var toastTimer = null;
  function toast(msg){
    var el = document.getElementById("toast");
    el.textContent = msg;
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.hidden = true; }, 4200);
  }

  /* ---------- persistence ---------- */
  function clone(o){ return JSON.parse(JSON.stringify(o)); }

  function setSyncState(s){
    syncState = s;
    var el = document.getElementById("sync-status");
    if (el) {
      el.setAttribute("data-state", s);
      el.innerHTML = '<span class="sync-dot"></span>' + syncLabel(s);
    }
  }

  function apiGet(){
    return fetch(API_URL + "?code=" + encodeURIComponent(accessCode) + "&t=" + Date.now(), { cache: "no-store" })
      .then(function(r){ return r.json(); });
  }

  function apiPost(baseRev, st){
    return fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ code: accessCode, baseRev: baseRev, state: st })
    }).then(function(r){ return r.json(); });
  }

  function normalizeState(s){
    if (!s.house) s.house = DEFAULT_STATE.house;
    if (!s.joinRequests) s.joinRequests = [];
    if (!s.admin || s.people.indexOf(s.admin) === -1) s.admin = s.people[0] || DEFAULT_STATE.admin;
    return s;
  }

  function forgetCode(){
    accessCode = null;
    try { localStorage.removeItem("roulement_code"); } catch (e) {}
    loadError = "Code d’accès incorrect.";
    renderAll();
  }

  function isEditing(){
    var a = document.activeElement;
    return !!(a && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName) && document.getElementById("app").contains(a));
  }

  function loadRemote(){
    if (!API_URL || !accessCode) return Promise.resolve();
    return apiGet().then(function(res){
      if (!res.ok) {
        if (res.error === "unauthorized") { forgetCode(); return; }
        loadError = "Erreur du serveur.";
        renderAll();
        return;
      }
      loadError = "";
      var firstLoad = !loaded;
      loaded = true;
      if ((firstLoad || res.rev !== rev) && (firstLoad || !isEditing())) {
        rev = res.rev;
        if (res.state && res.state.people && res.state.anchor) state = normalizeState(res.state);
        renderAll();
      }
      setSyncState("saved");
    }).catch(function(){
      if (!loaded) { loadError = "Impossible de joindre le serveur."; renderAll(); }
      else setSyncState("error");
    });
  }

  function performAction(mutator){
    var base = state;
    var next = clone(base);
    mutator(next);
    state = next;
    renderAll();
    persist(mutator, base, 0);
  }

  function persist(mutator, base, attempt){
    if (!API_URL) { setSyncState("preview"); return; }
    setSyncState("saving");
    apiPost(rev, state).then(function(res){
      if (res.ok) { rev = res.rev; setSyncState("saved"); return; }
      if (res.error === "unauthorized") { forgetCode(); return; }
      if (res.error === "conflict" && attempt < 1 && res.state) {
        rev = res.rev;
        var retryNext = clone(normalizeState(res.state));
        mutator(retryNext);
        state = retryNext;
        renderAll();
        persist(mutator, res.state, attempt + 1);
        return;
      }
      state = base; renderAll();
      if (res.error === "conflict") {
        toast("Quelqu’un a modifié les données en même temps. Réessaie ton action.");
        setSyncState("saved");
      } else {
        toast("Échec de l’enregistrement. Réessaie.");
        setSyncState("error");
      }
    }).catch(function(){
      state = base; renderAll();
      setSyncState("error");
      toast("Échec de l’enregistrement. Réessaie.");
    });
  }

  /* ---------- actions ---------- */
  function onSubmit(e){
    var form = e.target.closest("form[data-action]");
    if (!form) return;
    e.preventDefault();
    var action = form.getAttribute("data-action");

    if (action === "submit-code") {
      var typed = form.querySelector('input[name="code"]').value.trim();
      if (!typed) return;
      accessCode = typed;
      try { localStorage.setItem("roulement_code", typed); } catch (err) {}
      loadError = "";
      renderAll();
      loadRemote();
      return;
    }

    if (action === "confirm-swap") {
      var wk = form.getAttribute("data-week");
      var to = form.querySelector('select[name="to"]').value;
      var arrangement = form.querySelector('input[name="arrangement"]:checked').value;
      performAction(function(st){
        var from = assignedFor(wk, st);
        st.weeks[wk] = { status:"swapped", swap:{ from:from, to:to, arrangement:arrangement }, date: todayISO() };
        if (arrangement === "chore_debt") {
          st.choreDebts.push({ id: uid(), from: from, to: to, createdAt: todayISO(), settled: false });
        } else {
          st.ledger.push({ id: uid(), type:"swap_payment", from: from, to: to, amount: 20, date: todayISO(),
            note: "Échange du ménage du " + wk });
        }
      });
      ui.swapOpenFor = null;
      return;
    }

    if (action === "add-expense") {
      var desc = form.querySelector('input[name="desc"]').value.trim();
      var amount = parseFloat(form.querySelector('input[name="amount"]').value);
      var category = form.querySelector('select[name="category"]').value;
      var paidBy = form.querySelector('select[name="paidBy"]').value;
      var mode = form.querySelector('input[name="splitMode"]:checked').value;
      var editingId = form.getAttribute("data-editing") || null;

      if (!desc || !(amount > 0)) { toast("Vérifie la description et le montant."); return; }

      var rows = Array.prototype.slice.call(form.querySelectorAll(".split-person-row"));
      var checkedRows = rows.filter(function(row){ return row.querySelector('input[name="split"]').checked; });
      if (checkedRows.length === 0) { toast("Sélectionne au moins une personne."); return; }

      var splitResult;
      if (mode === "equal") {
        var names = checkedRows.map(function(row){ return row.querySelector('input[name="split"]').value; });
        splitResult = splitEqual(amount, names);
      } else if (mode === "exact") {
        var exactEntries = checkedRows.map(function(row){
          return { name: row.querySelector('input[name="split"]').value, amount: parseFloat(row.querySelector(".split-value").value) || 0 };
        });
        var sum = exactEntries.reduce(function(s, en){ return s + en.amount; }, 0);
        if (Math.abs(sum - amount) > 0.01) {
          toast("La somme des montants (" + fmtEUR(sum) + ") ne correspond pas au total (" + fmtEUR(amount) + ").");
          return;
        }
        splitResult = exactEntries.map(function(en){ return { name: en.name, amount: Math.round(en.amount * 100) / 100 }; });
      } else {
        var weightEntries = checkedRows.map(function(row){
          var w = parseFloat(row.querySelector(".split-value").value);
          return { name: row.querySelector('input[name="split"]').value, weight: (w > 0 ? w : 1) };
        });
        splitResult = splitByWeights(amount, weightEntries);
      }

      performAction(function(st){
        var existingDate = editingId ? (findExpense(st, editingId) || {}).date : null;
        var entry = {
          id: editingId || uid(), type:"expense", desc: desc, amount: Math.round(amount*100)/100,
          category: category, paidBy: paidBy, splitMode: mode, split: splitResult,
          date: existingDate || todayISO()
        };
        if (editingId) {
          var idx = -1;
          st.ledger.forEach(function(e, i){ if (e.id === editingId) idx = i; });
          if (idx !== -1) st.ledger[idx] = entry; else st.ledger.push(entry);
        } else {
          st.ledger.push(entry);
        }
      });
      ui.editingExpenseId = null;
      return;
    }

    if (action === "join") {
      var joinName = form.querySelector('input[name="name"]').value.trim();
      if (!joinName) { toast("Entre ton prénom pour rejoindre."); return; }
      if (state.people.length >= MAX_PEOPLE) { toast("Les " + MAX_PEOPLE + " colocataires sont déjà inscrit·e·s."); return; }
      if (state.people.indexOf(joinName) !== -1) { setMoi(joinName); renderAll(); return; }
      if (state.joinRequests.some(function(r){ return r.name === joinName; })) { setMoi(joinName); renderAll(); return; }
      setMoi(joinName);
      performAction(function(st){
        var already = st.people.indexOf(joinName) !== -1 || st.joinRequests.some(function(r){ return r.name === joinName; });
        if (already || st.people.length >= MAX_PEOPLE) return;
        if (st.people.length === 0) {
          st.people.push(joinName);
        } else {
          st.joinRequests.push({ id: uid(), name: joinName, requestedAt: todayISO() });
        }
      });
      return;
    }

    if (action === "save-settings") {
      var houseName = form.querySelector('input[name="house"]').value.trim();
      var inputs = form.querySelectorAll(".person-name-input");
      var names = Array.prototype.slice.call(inputs).map(function(i){ return i.value.trim(); });
      if (!houseName) { toast("Le nom de la colocation ne peut pas être vide."); return; }
      if (names.some(function(n){ return !n; })) { toast("Chaque colocataire doit avoir un prénom."); return; }
      var adminSelect = form.querySelector('select[name="admin"]');
      var adminName = state.admin;
      if (adminSelect) {
        var oldIdx = state.people.indexOf(adminSelect.value);
        adminName = oldIdx !== -1 ? names[oldIdx] : adminSelect.value;
      }
      performAction(function(st){ st.house = houseName; st.people = names; st.admin = adminName; });
      ui.settingsOpen = false;
      return;
    }
  }

  function onClick(e){
    var btn = e.target.closest("[data-action]");
    if (!btn || btn.tagName === "FORM") return;
    var action = btn.getAttribute("data-action");

    if (action === "retry-load") {
      loadError = "";
      renderAll();
      loadRemote();
      return;
    }
    if (action === "mark-done") {
      var wk = btn.getAttribute("data-week");
      performAction(function(st){
        st.weeks[wk] = { status:"pending_validation", doneBy: assignedFor(wk, st), date: todayISO() };
      });
      return;
    }
    if (action === "validate-done") {
      var vwk = btn.getAttribute("data-week");
      performAction(function(st){
        var existing = st.weeks[vwk];
        if (!existing || existing.status !== "pending_validation") return;
        if (!moi || existing.doneBy === moi) return;
        st.weeks[vwk] = { status:"done", doneBy: existing.doneBy, date: existing.date, validatedBy: moi, validatedAt: todayISO() };
      });
      return;
    }
    if (action === "admin-validate") {
      if (moi !== state.admin) { toast("Seul·e l’administrateur·rice peut valider directement."); return; }
      var awk = btn.getAttribute("data-week");
      performAction(function(st){
        if (moi !== st.admin) return;
        var existing = st.weeks[awk];
        var doneBy = (existing && existing.doneBy) || assignedFor(awk, st);
        var doneDate = (existing && existing.date) || todayISO();
        st.weeks[awk] = { status:"done", doneBy: doneBy, date: doneDate, validatedBy: moi, validatedAt: todayISO() };
      });
      return;
    }
    if (action === "admin-unvalidate") {
      if (moi !== state.admin) { toast("Seul·e l’administrateur·rice peut dévalider."); return; }
      var uwk = btn.getAttribute("data-week");
      performAction(function(st){
        if (moi !== st.admin) return;
        var existing = st.weeks[uwk];
        if (!existing || existing.status !== "done") return;
        st.weeks[uwk] = { status:"pending_validation", doneBy: existing.doneBy, date: existing.date };
      });
      return;
    }
    if (action === "open-swap") {
      ui.swapOpenFor = btn.getAttribute("data-week");
      renderAll();
      return;
    }
    if (action === "cancel-swap") {
      ui.swapOpenFor = null;
      renderAll();
      return;
    }
    if (action === "settle-chore-debt") {
      var id = btn.getAttribute("data-id");
      performAction(function(st){
        st.choreDebts.forEach(function(d){ if (d.id === id) { d.settled = true; d.settledAt = todayISO(); } });
      });
      return;
    }
    if (action === "delete-expense") {
      var eid = btn.getAttribute("data-id");
      if (!confirm("Supprimer cette dépense ?")) return;
      performAction(function(st){
        st.ledger = st.ledger.filter(function(e){ return e.id !== eid; });
      });
      if (ui.editingExpenseId === eid) ui.editingExpenseId = null;
      return;
    }
    if (action === "edit-expense") {
      ui.editingExpenseId = btn.getAttribute("data-id");
      renderAll();
      var ef = document.getElementById("expense-form");
      if (ef) ef.scrollIntoView({ behavior: "smooth", block: "start" });
      return;
    }
    if (action === "cancel-edit-expense") {
      ui.editingExpenseId = null;
      renderAll();
      return;
    }
    if (action === "settle-balance") {
      var from = btn.getAttribute("data-from"), to = btn.getAttribute("data-to"), amount = parseFloat(btn.getAttribute("data-amount"));
      performAction(function(st){
        st.ledger.push({ id: uid(), type:"settlement", from: from, to: to, amount: amount, date: todayISO() });
      });
      return;
    }
    if (action === "toggle-settings") {
      ui.settingsOpen = !ui.settingsOpen;
      renderAll();
      return;
    }
    if (action === "pick-existing") {
      var picked = document.getElementById("join-pick").value;
      setMoi(picked);
      renderAll();
      return;
    }
    if (action === "switch-me") {
      setMoi(null);
      renderAll();
      return;
    }
    if (action === "approve-request") {
      var reqId = btn.getAttribute("data-id");
      if (moi !== state.admin) { toast("Seul·e l’administrateur·rice peut valider une inscription."); return; }
      performAction(function(st){
        if (moi !== st.admin) return;
        var reqIdx = -1;
        st.joinRequests.forEach(function(r,i){ if (r.id === reqId) reqIdx = i; });
        if (reqIdx === -1) return;
        var reqName = st.joinRequests[reqIdx].name;
        if (st.people.length < MAX_PEOPLE && st.people.indexOf(reqName) === -1) st.people.push(reqName);
        st.joinRequests.splice(reqIdx, 1);
      });
      return;
    }
    if (action === "reject-request") {
      var rejId = btn.getAttribute("data-id");
      if (moi !== state.admin) { toast("Seul·e l’administrateur·rice peut refuser une inscription."); return; }
      performAction(function(st){
        if (moi !== st.admin) return;
        st.joinRequests = st.joinRequests.filter(function(r){ return r.id !== rejId; });
      });
      return;
    }
    if (action === "cancel-request") {
      performAction(function(st){
        st.joinRequests = st.joinRequests.filter(function(r){ return r.name !== moi; });
      });
      setMoi(null);
      renderAll();
      return;
    }
    if (action === "remove-person") {
      var idx = parseInt(btn.getAttribute("data-index"), 10);
      var pname = state.people[idx];
      if (!confirm("Retirer " + pname + " de " + state.house + " ? Son historique (dettes, dépenses) est conservé.")) return;
      performAction(function(st){ st.people = st.people.filter(function(p,i){ return i !== idx; }); });
      if (moi === pname) setMoi(null);
      return;
    }
  }

  function setMoi(name){
    moi = name || null;
    try { if (moi) localStorage.setItem("roulement_moi", moi); else localStorage.removeItem("roulement_moi"); } catch (err) {}
  }

  document.addEventListener("submit", onSubmit);
  document.addEventListener("click", onClick);
  document.addEventListener("change", function(e){
    var form = e.target.closest("#expense-form");
    if (!form) return;
    if (e.target.name === "splitMode" || e.target.name === "split") updateSplitUI(form);
  });
  document.addEventListener("input", function(e){
    var form = e.target.closest("#expense-form");
    if (!form) return;
    if (e.target.id === "exp-amount" || e.target.classList.contains("split-value")) {
      var modeInput = form.querySelector('input[name="splitMode"]:checked');
      if (modeInput) updateSplitHint(form, modeInput.value);
    }
  });

  /* ---------- init ---------- */
  renderAll();
  if (API_URL) {
    loadRemote();
    setInterval(function(){ if (!document.hidden) loadRemote(); }, 15000);
    document.addEventListener("visibilitychange", function(){ if (!document.hidden) loadRemote(); });
  }

})();
</script>
